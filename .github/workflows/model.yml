name: model

# Train on the versioned dataset, apply the release gates, export, package
# the inference service and smoke-test the container. Tags publish a release.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["data/dataset/**", "configs/**", "src/groundeffect/models/**", "src/groundeffect/serve.py", "Dockerfile", ".github/workflows/model.yml"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Train, evaluate and gate
        run: uv run groundeffect train --no-figures
      - name: Gate summary
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open("artifacts/metrics.json"))
          print(f"### Model gates: {'PASSED' if m['passed'] else 'FAILED'} (dataset `{m['dataset']}`)\n")
          print("| gate | value | threshold | result |\n|---|---|---|---|")
          for g in m["gates"]:
              print(f"| {g['name']} | {g['value']:.4f} | {g['op']} {g['threshold']} | {'pass' if g['passed'] else 'FAIL'} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model
          path: artifacts/

  image:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: groundeffect:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name svc -p 8000:8000 groundeffect:test
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/predict -H 'content-type: application/json' \
            -d '{"designs":[{"h_c":0.15,"alpha_deg":4,"camber":0.04,"thickness":0.12}],"include_cp":false}' | tee pred.json
          python3 -c "import json; p=json.load(open('pred.json'))[0]; assert 0.9 < p['cl_down'] < 1.6, p"
          docker logs svc
      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          docker tag groundeffect:test "$IMAGE:${GITHUB_SHA::7}"
          docker push "$IMAGE:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then docker tag groundeffect:test "$IMAGE:latest"; docker push "$IMAGE:latest"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [train, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: model
          path: artifacts/
      - name: Publish release with the gated model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar czf model-${GITHUB_REF_NAME}.tar.gz -C artifacts .
          gh release create "$GITHUB_REF_NAME" model-${GITHUB_REF_NAME}.tar.gz artifacts/model_card.md \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file artifacts/model_card.md
