[project]
name = "groundeffect"
version = "0.1.0"
description = "OpenFOAM-to-PyTorch pipeline for a wing in ground effect: automated meshing, QA-gated CFD data, surrogates with calibrated uncertainty, wind-tunnel data QA and CI/CD model deployment."
readme = "README.md"
authors = [
    { name = "Daniel Bruno", email = "danielbruno@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
groundeffect = "groundeffect.cli:main"

[project.optional-dependencies]
# Meshing / CFD data generation. Not needed to serve the model.
cfd = ["gmsh>=4.15.2"]
physicsnemo = [
    "nvidia-physicsnemo>=2.2.2",
    "torch-geometric>=2.8.1",
]

# CPU-only PyTorch wheels on Linux (CI runners, the serving image). macOS uses
# PyPI (CPU + MPS). GPU training nodes install the CUDA build instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.coverage.run]
source = ["groundeffect"]
omit = ["src/groundeffect/cli.py", "src/groundeffect/report.py"]
